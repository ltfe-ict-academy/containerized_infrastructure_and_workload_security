services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:5173"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ENABLE_DEBUG_ROUTES: "true"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:8
    ports:
      - "6379:6379"

volumes:
  postgres_data:
