name: hardened-app

x-security-defaults: &security-defaults
  # Never grant full host-like privileges.
  privileged: false

  # Run as non-root. Match Dockerfile USER where possible.
  user: "10001:10001"

  # Prevent privilege escalation via setuid/setgid binaries.
  security_opt:
    - no-new-privileges:true
    # Optional custom profiles, if you maintain them:
    # - apparmor:docker-default
    # - seccomp:./seccomp-profile.json

  # Start from zero Linux capabilities.
  cap_drop:
    - ALL

  # Only add back what the app truly needs.
  # Most web apps need none.
  # cap_add:
  #   - NET_BIND_SERVICE

  # Make root filesystem immutable.
  read_only: true

  # Writable temporary files only where explicitly allowed.
  tmpfs:
    - /tmp:size=64m,mode=1777,uid=10001,gid=10001
    - /run:size=16m,mode=0755,uid=10001,gid=10001

  # Resource limits.
  pids_limit: 128
  mem_limit: 256m
  mem_reservation: 128m
  cpus: "0.50"

  ulimits:
    nofile:
      soft: 1024
      hard: 4096
    nproc: 256

  # Safer process handling.
  init: true

  # Avoid infinite restart storms.
  restart: on-failure:3

  # Prevent logs from filling disk.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *security-defaults

    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - npm_token

    image: registry.example.com/myapp:1.0.0

    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: db
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD_FILE: /run/secrets/db_password

    secrets:
      - db_password

    # Bind to localhost only if a host reverse proxy handles public traffic.
    # Avoid "8080:3000" unless you intentionally want public exposure.
    ports:
      - "127.0.0.1:8080:3000"

    # If only other containers need this port, prefer expose instead of ports.
    expose:
      - "3000"

    networks:
      - frontend
      - backend

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine

    # Official DB images usually need writable data directories.
    # Do not set read_only: true unless you also provide every required writable path.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    pids_limit: 256
    mem_limit: 512m
    restart: on-failure:3

    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password

    secrets:
      - db_password

    volumes:
      - db_data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

secrets:
  db_password:
    file: ./secrets/db_password.txt

  # Build-time secret. Do not commit this file.
  npm_token:
    file: ./.npm_token

volumes:
  db_data:

networks:
  frontend:
    driver: bridge
    driver_opts:
      # Default host binding for this network; still explicitly bind ports.
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"

  backend:
    driver: bridge
    internal: true