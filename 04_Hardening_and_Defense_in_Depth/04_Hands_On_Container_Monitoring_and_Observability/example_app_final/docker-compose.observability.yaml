name: observability-stack

services:
  docker-events:
    image: ${DOCKER_CLI_IMAGE:-docker:cli}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - sh
      - -c
      - |
        echo '{"source":"docker-events","message":"docker event stream started"}'
        docker events --format '{{json .}}'
    depends_on:
      - alloy
    networks:
      - observability_net



  beyla-backend:
    image: ${BEYLA_IMAGE:-grafana/beyla:latest}
    profiles:
      - beyla
    init: true
    restart: unless-stopped
    pid: "service:backend"
    privileged: true
    environment:
      BEYLA_OPEN_PORT: "8000"
      BEYLA_LOG_LEVEL: "INFO"
      BEYLA_PROMETHEUS_PORT: "9090"
      BEYLA_PROMETHEUS_PATH: "/metrics"
      BEYLA_PROMETHEUS_FEATURES: "application,application_process,application_service_graph"
      OTEL_SERVICE_NAME: "course-backend"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=training,service.namespace=container-security"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://alloy:4317"
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "grpc"
    depends_on:
      - backend
      - alloy
    networks:
      - observability_net

  trace-generator:
    image: ${TELEMETRYGEN_IMAGE:-ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest}
    profiles:
      - trace-test
    command:
      - traces
      - --otlp-endpoint=alloy:4317
      - --otlp-insecure
      - --service=course-synthetic-client
      - --duration=5m
      - --rate=1
    depends_on:
      - alloy
    networks:
      - observability_net

  falco-event-generator:
    image: ${FALCO_EVENT_GENERATOR_IMAGE:-falcosecurity/event-generator:latest}
    profiles:
      - falco-test
    command:
      - run
      - syscall
      - --loop
    depends_on:
      - falco
    networks:
      - observability_net

volumes:
  grafana_data:
  prometheus_data:
  loki_data:
  tempo_data:
  alloy_data:
  portainer_data:

networks:
  observability_net:
    driver: bridge
    external: true
  public_net:
    driver: bridge
