services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://${SERVER_IP:-localhost}:8000/api"
    ports:
      - "3000:8080"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      args:
        UV_VERSION: "0.11.15"
        UV_INDEX_URL: "https://pypi.org/simple"
        APP_UID: "10001"
        APP_GID: "10001"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-courseapp}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-courseappredis}@redis:6379/0"
      ENABLE_DEBUG_ROUTES: "false"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  db:
    image: dhi.io/postgres:18-alpine3.22@sha256:092b83bf7e7be059a662c4aa5987f0e0e4dc03a5ea7097ec4e05759de3f6d1b3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-courseapp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: dhi.io/redis:8.6.3-debian13@sha256:db21f5e0bf266b9fbd8df9b7aef140785465f5330fdc86662ec960d10118cefe
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:-courseappredis}"
    ports:
      - "6379:6379"

volumes:
  postgres_data:
